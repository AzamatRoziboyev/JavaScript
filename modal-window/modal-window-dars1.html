<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>modal-window-dars1</title>
    <link rel="stylesheet" href="modal-window-dars1.css">
</head>
<body>
    <button class="open-btn">Tizimga Kirish</button>
    <div class="modal">
        <form class="modal-content">
            <label for="ism">Isminggizni yozing</label>
            <input type="text" id="ism" required>
            <label for="parol">Parolingzni kiriting</label>
            <input type="password" id="parol" required>
            <button class="send">Yuborish</button>
            <button class="close-btn">Yopish</button>
        </form>
    </div>

    <script src="modal-window-dars1.js"></script>
</body>
</html>
