<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>carusel</title>
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"rel="stylesheet"/>
</head>
<body>
    <h1>carusel</h1>
    <div class="carusel-windows">
        <div class="carusel-track" id="turck">
            <div class="card" style="background-color: #ff9f43;">Karta 1</div>
            <div class="card" style="background-color: #54a0ff;">Karta 2</div>
            <div class="card" style="background-color: #5f27cd">Karta 3</div>
            <div class="card" style="background-color: #10ac84">Karta 4</div>
            <div class="card" style="background-color: #ee5253;">Karta 5</div>
        </div>
    </div>
    <div class="controls">
        <button id="prevBtn"><i class="ri-arrow-left-long-line"></i></button>
        <button id="nextBtn"><i class="ri-arrow-right-long-line"></i></button>
    </div>




    <script src="carusel-dars1.js"></script>
</body>
</html>
